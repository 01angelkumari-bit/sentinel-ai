database_url_env: DATABASE_URL
source:
  table: customers
  columns: [id, customer_number, company_name, email, phone, region, status, created_at]
  incremental_column: created_at
  incremental_value: null
  batch_size: 10000
  max_rows: 1000000
schema_rules:
  id: {type: string, required: true, nullable: false, primary_key: true}
  customer_number: {type: string, required: true, nullable: false}
  company_name: {type: string, required: true, nullable: false}
  email: {type: email, required: true, nullable: false, pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'}
  phone: {type: phone, nullable: true}
  region: {type: string, required: true, nullable: false}
  status: {type: string, required: true, nullable: false}
  created_at: {type: datetime, required: true, nullable: false}
missing_values:
  phone: {strategy: constant, value: unknown}
cleaning:
  company_name: {trim: true, normalize_unicode: true, titlecase: true}
  email: {trim: true, lowercase: true}
  phone: {trim: true}
  region: {trim: true, titlecase: true}
normalization:
  status: {method: label}
allow_unexpected_columns: false
output_format: records
log_level: INFO
pool_size: 5
max_overflow: 10
pool_timeout_seconds: 30
statement_timeout_seconds: 60
reconnect_attempts: 3
downstream_agents: [analytics, report, visualization, ml, recommendation, pdf, dashboard]
