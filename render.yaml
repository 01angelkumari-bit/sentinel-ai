services:
  - type: web
    name: sentinel-ai-api
    runtime: python
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt && python -m alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: CORS_ORIGINS
        sync: false
      - key: STORAGE_ROOT
        value: /tmp/sentinel
      - key: MAX_UPLOAD_BYTES
        value: 10485760
      - key: AI_PROVIDER
        value: deterministic
      - key: AI_BASE_URL
        value: ""
      - key: EMAIL_PROVIDER
        value: gmail_api
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USE_TLS
        value: true
      - key: SMTP_USE_SSL
        value: false
      - key: EMAIL_FROM
        sync: false
